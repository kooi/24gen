<script>

function printSolution(res) {
  let d = document.createElement('details');
  d.style = "font-family: Sans Serif; line-height: 2em;";
  let s = document.createElement('summary')
  s.innerHTML = `[ ${res.getallen[0]} ${res.getallen[1]} ${res.getallen[2]} ${res.getallen[3]} ]`;
  let ol = document.createElement('ol');
  for (sol of res.oplossingen) {
    let li = document.createElement('li');
    sol = sol.replace(/\*/g,times);
    sol = sol.replace(/\//,':');
    sol = sol.replace(/-/,eraf);
    li.innerHTML = sol;
    ol.appendChild(li);
  }
  d.appendChild(s);
  d.appendChild(ol);
  return d;
}

function gen(){
  let n = Number(document.getElementById('num_to_generate').value);
  let tgt = document.getElementById('puzzels');
  for (let i = 0; i < n; i++) {

    let res = generate();
    let e = printSolution(res);
    tgt.appendChild(e);
    console.log(res);
  }
}

function generate() {
	var solutions = 0;
	var hulp="";
	var hulp2= new Array(4);

	do {
			for (var i=0; i<4; i++) getallen[i]= 1+Math.floor(Math.random()*9);
			getallen.sort(); //getallen sorteren van klein naar groot, om te kunnen checken of het al eens gebruikt is

	// console.log(getallen)

}

function buttonClick(knop) {
	if (gestart)

									gebruikt[1]=true;

			case 'c': //a=0,b=1,c=2,d=3

									//direct voor een getal mag niet een getal geklikt zijn

									gebruikt[2]=true;
									invoer[numclicks]=2; numclicks++;
									vorigeKnop = 2;
								}
								break;
			case 'd': //a=0,b=1,c=2,d=3
								if ((!gebruikt[3]) && (vorigeKnop>3 || numclicks == 0)){
									//direct voor een getal mag niet een getal geklikt zijn

									gebruikt[3]=true;
									invoer[numclicks]=3; numclicks++;
									vorigeKnop = 3;
								}
								break;
			case '+':
								if (!(vorigeKnop>=4 && vorigeKnop<=7) && numclicks>0){
									//direct voor een operatie mag geen andere operatie geklikt zijn
									vorigeKnop = 4; invoer[numclicks]=4; numclicks++;
								}
								break;   //+
			case '-':
								if (!(vorigeKnop>=4 && vorigeKnop<=7) && numclicks>0){
									//direct voor een operatie mag geen andere operatie geklikt zijn
									vorigeKnop = 5; invoer[numclicks]=5; numclicks++;
								}
								break;   //-
			case '*':
								if (!(vorigeKnop>=4 && vorigeKnop<=7) && numclicks>0){
									//direct voor een operatie mag geen andere operatie geklikt zijn
									vorigeKnop = 6; invoer[numclicks]=6; numclicks++;
								}
								break;   //*
			case '/':
								if (!(vorigeKnop>=4 && vorigeKnop<=7) && numclicks>0){
									//direct voor een operatie mag geen andere operatie geklikt zijn
									vorigeKnop = 7; invoer[numclicks]=7; numclicks++;
								}
								break;   //:
			case '(':
								if ((vorigeKnop>3 && vorigeKnop!=9) || numclicks == 0){
									//direct voor een openhaakje mag geen getal geklikt zijn
									vorigeKnop = 8; invoer[numclicks]=8; numclicks++;
								}
								break;   //(
			case ')':
								if (!(vorigeKnop>=4 && vorigeKnop<=8) && numclicks > 0){
									//direct voor een sluithaakje mag geen operator geklikt zijn
									vorigeKnop = 9; invoer[numclicks]=9; numclicks++;
								}
								break; //)
			case 'back':
								if (numclicks>0){
										numclicks--;
										laatste = invoer[numclicks];
										if (laatste<4) {
											gebruikt[laatste] = false;
											druk_flippo(24,getallen[0],getallen[1],getallen[2],getallen[3]);

										else vorigeKnop = -1;
								}
							 	break; //backspace
			case '=':
								if (numclicks>0){

												document.getElementById('goedtekst4').innerHTML="&nbsp;";
												document.getElementById('goedtekst5').innerHTML="There are "+aantal_oplossingen+" solutions";
												document.getElementById('goedtekst6').innerHTML="Press <b>start</b> to get a new challenge";
												document.getElementById('melding_goed').style.display='block';
												aantalGoed++
												gestart = false;
												klaar = " = 24 <font color=\"#E31E24\"><b> correct!</b></font>";
												surrenderbutton.style.display = "none";
												startbutton.style.display = "block";
											}
											else{
												document.getElementById('fouttekst1').innerHTML="The result is indeed 24:";
												document.getElementById('fouttekst2').innerHTML=naarString(invoer,numclicks)+' = 24';
												document.getElementById('fouttekst3').innerHTML="But you didn't use all four numbers";
												document.getElementById('fouttekst4').innerHTML="So, that is not correct after all";
												document.getElementById('fouttekst5').innerHTML="&nbsp;";
												document.getElementById('fouttekst6').innerHTML="Try again";
												document.getElementById('melding_fout').style.display='block';
												numclicks = 0;
											}
										}
										else {
											document.getElementById('fouttekst1').innerHTML="No, that is not right";
											document.getElementById('fouttekst2').innerHTML="&nbsp;";
											document.getElementById('fouttekst3').innerHTML="Your input gives:";
											document.getElementById('fouttekst4').innerHTML=naarString(invoer,numclicks)+' = '+hulp;
											document.getElementById('fouttekst5').innerHTML="&nbsp;";
											document.getElementById('fouttekst6').innerHTML="Try again";
											document.getElementById('melding_fout').style.display='block';
											numclicks = 0;
										}
										for (var i=0; i<4; i++) gebruikt[i]=false;
										druk_flippo(24,getallen[0],getallen[1],getallen[2],getallen[3]);
									}

}

function calculate(){
//	var solutions = document.getElementById("solutions");
	aantal_oplossingen = 0;
	for (var i=0; i<24; i++)
		{
			var p = getallen[parseInt(volgordes[i].substring(0,1))];
			var q = getallen[parseInt(volgordes[i].substring(1,2))];
			var r = getallen[parseInt(volgordes[i].substring(2,3))];
			var s = getallen[parseInt(volgordes[i].substring(3,4))];
			for (var k1=0; k1<4; k1++){
				for (var k2=0; k2<4; k2++){
					for (var k3=0; k3<4; k3++){
							var o1=operatie[k1];
							var o2=operatie[k2];
							var o3=operatie[k3];
							//(((a#b)#c)#d)
								if (Math.abs(bereken(bereken(bereken(p,q,o1),r,o2),s,o3) - 24) <= 0.01)
								{
									oplossingen[aantal_oplossingen] = "(("+p+o1+q+")"+o2+r+")"+o3+s;
									aantal_oplossingen ++;
								}
							//((a#(b#c))#d)
								if (Math.abs(bereken(bereken(p,bereken(q,r,o2),o1),s,o3) - 24)<=0.01)
								{
									oplossingen[aantal_oplossingen] = "("+p+o1+"("+q+o2+r+"))"+o3+s;
									aantal_oplossingen ++;
								}
							//((a#b)#(c#d))
								if (Math.abs(bereken(bereken(p,q,o1),bereken(r,s,o3),o2) - 24)<=0.01)
								{
									oplossingen[aantal_oplossingen] = "("+p+o1+q+")"+o2+"("+r+o3+s+")";
									aantal_oplossingen ++;
								}
							//(a#((b#c)#d))
								if (Math.abs(bereken(p,bereken(bereken(q,r,o2),s,o3),o1) - 24)<=0.01)
								{
									oplossingen[aantal_oplossingen] = p+o1+"(("+q+o2+r+")"+o3+s+")";
									aantal_oplossingen ++;
								}
							//(a#(b#(c#d)))
								if (Math.abs(bereken(p,bereken(q,bereken(r,s,o3),o2),o1) - 24)<=0.01){
									oplossingen[aantal_oplossingen] = p+o1+"("+q+o2+"("+r+o3+s+"))";
									aantal_oplossingen ++;
								}
							//dubbele items verwijderen uit de oplossingen-array
								if (aantal_oplossingen>1){
									for (var ii=0; ii<aantal_oplossingen; ii++){
										for (var j=ii+1; j<aantal_oplossingen; j++){
												if (oplossingen[j] == oplossingen[ii]){
													for (var k=j; k<aantal_oplossingen; k++){
														oplossingen[k]=oplossingen[k+1];
													}
													aantal_oplossingen--;
													j--;
												}
										}
									}
								}
					}
				}
			}
		};
	  return aantal_oplossingen;
}

function bereken(a, b, operatie) {
		var x=0;
		if (operatie == "+") x=a+b;
		if (operatie == "-") x=a-b;
		if (operatie == "*") x=a*b;
		if (operatie == "/") x=a/b;
		return x;
}

function naarString(klikrij,numkliks){
	var regel="";
	for (var i=0; i<numkliks; i++){
		if (klikrij[i]<4) regel = regel + getallen[klikrij[i]];
		else regel = regel + operatie2[klikrij[i]-4];// de operaties  +-x:()
	}
	return regel
}

function naarBerekening(klikrij,numkliks){
	var regel="";
	for (var i=0; i<numkliks; i++){
		if (klikrij[i]<4) regel = regel + getallen[klikrij[i]];
		else regel = regel + operatie[klikrij[i]-4];// de operaties  +-*/()
	}
	return regel
}

function shuffle(array){
	var m = array.length, t, i;
	// While there remain elements to shuffle…
	while (m) {
		// Pick a remaining element…
		i = Math.floor(Math.random() * m--);
		// And swap it with the current element.
		t = array[m];
		array[m] = array[i];
		array[i] = t;
	}
	return array;
}

<!DOCTYPE html>

<head>
  <title>24 Game</title>
  <meta charset="utf-8">
  <meta name="description" content="HTML5-App: 24 Game">
  <meta name="author" content="Henk Reuling">
  <meta name="keywords" content="app, mathematics, calculation, order of operations">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: content-box;
    /*border: 1pt solid blue;*/
    line-height: 1.5em;
    /*font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;*/
}
html {
    font-size: 12pt;
}
.container {
    width: 100%;
    height: 100%;
}
ol li {
    list-style-type: none;
    counter-increment: list;
    position: relative;
}

ol li:after {
    content: counter(list) ".";
    position: absolute;
    left: -2.5em;
    width: 2em;
    text-align: right;
    color: grey;
}
</style>
</head>

<body>

<div class="container">
    <h1 id="koptekst">24 Game</h1>
    <input type="number" value="5" id="num_to_generate">
    <button onclick="gen();">Generate</button>
    <div id="puzzels"></div>
</div>

<script>
function printSolution(res) {
  let d = document.createElement("details");
  let s = document.createElement("summary");
  s.innerHTML = `[ ${res.getallen[0]} ${res.getallen[1]} ${res.getallen[2]} ${res.getallen[3]} ]`;
  d.appendChild(s);
  let ol = document.createElement("ol");
  for (sol of res.oplossingen) {
    if (sol) {
      let li = document.createElement("li");
      sol = sol.replaceAll(/\*/g, times);
      sol = sol.replaceAll(/\//g, ":");
      sol = sol.replaceAll(/-/g, eraf);
      li.innerHTML = `\(${sol}\)`;
      ol.appendChild(li);
    }
  }
  d.appendChild(ol);
  return d;
}

function gen() {
  let n = Number(document.getElementById("num_to_generate").value);
  let tgt = document.getElementById("puzzels");
  for (let i = 0; i < n; i++) {
    let res = generate();
    let e = printSolution(res);
    tgt.appendChild(e);
    console.log(res);
  }
}

var volgordes = [
  "0123",
  "0132",
  "0213",
  "0231",
  "0312",
  "0321",
  "1023",
  "1032",
  "1203",
  "1230",
  "1302",
  "1320",
  "2013",
  "2031",
  "2103",
  "2130",
  "2301",
  "2310",
  "3012",
  "3021",
  "3102",
  "3120",
  "3201",
  "3210",
];
// Truc om de 24 volgordes om de 4 getallen over de 4 plaatsen te verdelen -->
// op een handige manier langs te lopen; het zijn de 24 'masks'.
var times = "\u00D7";
var eraf = "\u2212";
var operatie = ["+", "-", "*", "/", "(", ")"];
var operatie2 = ["+", eraf, times, ":", "(", ")"];
var getallen = new Array(4);
var gebruikt = new Array(4);
var oplossingen = new Array();
var aantalOpgaven = 0;
var gemaakteOpgaven = new Array();

var aantal_oplossingen = 0;
var numclicks;
var voorbeeldOplossing = "";

function generate() {
  var solutions = 0;
  numclicks = 0;
  do {
    for (var i = 0; i < 4; i++) {
      getallen[i] = 1 + Math.floor(Math.random() * 9);
    }
    getallen.sort(); //getallen sorteren van klein naar groot, om te kunnen checken of het al eens gebruikt is
    solutions = calculate(getallen);
    // -> solutions = calculate(getallen).length
  } while (
    solutions <= 50 * 0.85 ** aantalOpgaven ||
    gemaakteOpgaven.indexOf(
      "" + getallen[0] + getallen[1] + getallen[2] + getallen[3],
    ) >= 0 ||
    (aantalOpgaven > 3 &&
      getallen[0] + getallen[1] + getallen[2] + getallen[3] == 24)
  );
  //check:
  // - zijn er voldoende oplossingen, ofwel, is ie eenvoudig genoeg?
  // - is deze flippo al gemaakt? Dan niet nog een keer
  // - alleen bij de eerste drie mag de som van de cijfers 24 zijn. Daarna is dat te eenvoudig

  //gemaakte opgaven opslaan
  gemaakteOpgaven[aantalOpgaven] =
    "" + getallen[0] + getallen[1] + getallen[2] + getallen[3];
  aantalOpgaven++;

  shuffle(getallen); //volgorde weer door elkaar gooien zodat niet telkens het kleinste getal boven staat;
  for (var i = 0; i < 4; i++) {
    gebruikt[i] = false;
  }
  vorigeKnop = 0;
  gestart = true;

  return { getallen, oplossingen };
}

// pass [a, b, c, d]
// use local solutions
// return []solutions
function calculate(g) {
  aantal_oplossingen = 0;
  for (var i = 0; i < 24; i++) {
    var p = g[parseInt(volgordes[i].substring(0, 1))];
    var q = g[parseInt(volgordes[i].substring(1, 2))];
    var r = g[parseInt(volgordes[i].substring(2, 3))];
    var s = g[parseInt(volgordes[i].substring(3, 4))];
    for (var k1 = 0; k1 < 4; k1++) {
      for (var k2 = 0; k2 < 4; k2++) {
        for (var k3 = 0; k3 < 4; k3++) {
          var o1 = operatie[k1];
          var o2 = operatie[k2];
          var o3 = operatie[k3];
          //(((a#b)#c)#d)
          if (
            Math.abs(bereken(bereken(bereken(p, q, o1), r, o2), s, o3) - 24) <=
            0.01
          ) {
            oplossingen[aantal_oplossingen] =
              "((" + p + o1 + q + ")" + o2 + r + ")" + o3 + s;
            aantal_oplossingen++;
          }
          //((a#(b#c))#d)
          if (
            Math.abs(bereken(bereken(p, bereken(q, r, o2), o1), s, o3) - 24) <=
            0.01
          ) {
            oplossingen[aantal_oplossingen] =
              "(" + p + o1 + "(" + q + o2 + r + "))" + o3 + s;
            aantal_oplossingen++;
          }
          //((a#b)#(c#d))
          if (
            Math.abs(bereken(bereken(p, q, o1), bereken(r, s, o3), o2) - 24) <=
            0.01
          ) {
            oplossingen[aantal_oplossingen] =
              "(" + p + o1 + q + ")" + o2 + "(" + r + o3 + s + ")";
            aantal_oplossingen++;
          }
          //(a#((b#c)#d))
          if (
            Math.abs(bereken(p, bereken(bereken(q, r, o2), s, o3), o1) - 24) <=
            0.01
          ) {
            oplossingen[aantal_oplossingen] =
              p + o1 + "((" + q + o2 + r + ")" + o3 + s + ")";
            aantal_oplossingen++;
          }
          //(a#(b#(c#d)))
          if (
            Math.abs(bereken(p, bereken(q, bereken(r, s, o3), o2), o1) - 24) <=
            0.01
          ) {
            oplossingen[aantal_oplossingen] =
              p + o1 + "(" + q + o2 + "(" + r + o3 + s + "))";
            aantal_oplossingen++;
          }
          //dubbele items verwijderen uit de oplossingen-array
          if (aantal_oplossingen > 1) {
            for (var ii = 0; ii < aantal_oplossingen; ii++) {
              for (var j = ii + 1; j < aantal_oplossingen; j++) {
                if (oplossingen[j] == oplossingen[ii]) {
                  for (var k = j; k < aantal_oplossingen; k++) {
                    oplossingen[k] = oplossingen[k + 1];
                  }
                  aantal_oplossingen--;
                  j--;
                }
              }
            }
          }
        }
      }
    }
  }
  return aantal_oplossingen;
}

function bereken(a, b, operatie) {
  var x = 0;
  if (operatie == "+") x = a + b;
  if (operatie == "-") x = a - b;
  if (operatie == "*") x = a * b;
  if (operatie == "/") x = a / b;
  return x;
}

function shuffle(array) {
  var m = array.length,
    t,
    i;
  // While there remain elements to shuffle…
  while (m) {
    // Pick a remaining element…
    i = Math.floor(Math.random() * m--);
    // And swap it with the current element.
    t = array[m];
    array[m] = array[i];
    array[i] = t;
  }
  return array;
}
</script>
</body>

</html>
